[project]
name = "conv_wm"
version = "0.2.0"
description = "Reproducible data pipeline and audits for a multimodal conversational world model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pandera[pandas]>=0.33.1",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
# Exploration only: the maintained implementation never imports these.
notebooks = [
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "skimpy>=0.0.21",
    "tqdm>=4.70.0",
]
# Diagnostic only: the vocal annotation coverage audit runs Silero VAD.
# The v0 pipeline (cleaning, native focal voice state) never imports these.
coverage-audit = [
    "onnxruntime>=1.20",
    "silero-vad>=6.2",
]

[project.scripts]
conv-wm = "conv_wm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_wm"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint]
# Public functions and methods of the maintained implementation document
# their semantics, units and return values.
extend-select = ["D102", "D103"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: per-file try/except loops and ad-hoc subprocess
# wrappers are expected there. Undefined/redefined names stay enabled.
"notebooks/**/*.ipynb" = ["BLE001", "PLW1510", "D102", "D103"]
# Test names are the documentation.
"tests/**/*.py" = ["D102", "D103"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
