[project]
name = "conv_wm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.6",
    "matplotlib>=3.11.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pandera[pandas]>=0.33.1",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "skimpy>=0.0.21",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_wm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: per-file try/except loops and ad-hoc subprocess
# wrappers are expected there. Undefined/redefined names stay enabled.
"notebooks/**/*.ipynb" = ["BLE001", "PLW1510"]
