[project]
name = "conv_wm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.6",
    "matplotlib>=3.11.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_wm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
